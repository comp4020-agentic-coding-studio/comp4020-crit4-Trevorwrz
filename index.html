<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falling Notes</title>
    <meta
      name="description"
      content="A browser instrument: press a lane whenever you like and it sings — no score, no wrong note, no way to lose."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Falling Notes</h1>
      <p class="hint">Press, click, or tap a lane whenever you feel like it.</p>

      <div class="lanes" id="lanes">
        <div class="lane" data-lane="0" style="--lane-hue: 340">
          <div class="track" data-track="0"></div>
          <button type="button" data-lane-button="0" aria-label="Play lane 1, note C">A</button>
        </div>
        <div class="lane" data-lane="1" style="--lane-hue: 20">
          <div class="track" data-track="1"></div>
          <button type="button" data-lane-button="1" aria-label="Play lane 2, note D">S</button>
        </div>
        <div class="lane" data-lane="2" style="--lane-hue: 90">
          <div class="track" data-track="2"></div>
          <button type="button" data-lane-button="2" aria-label="Play lane 3, note E">D</button>
        </div>
        <div class="lane" data-lane="3" style="--lane-hue: 190">
          <div class="track" data-track="3"></div>
          <button type="button" data-lane-button="3" aria-label="Play lane 4, note G">F</button>
        </div>
        <div class="lane" data-lane="4" style="--lane-hue: 270">
          <div class="track" data-track="4"></div>
          <button type="button" data-lane-button="4" aria-label="Play lane 5, note A">G</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
